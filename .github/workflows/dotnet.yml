name: .NET CI

on:
  push:
    branches: [ "main", "lab2" ]
    paths:
      - 'Server/**'
  pull_request:
    branches: [ "main", "lab2" ]
    paths:
      - 'Server/**'

jobs:
  build:
    name: Build Solution
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ./Server/BooksLab.sln

    - name: Build Solution
      run: dotnet build ./Server/BooksLab.sln --configuration Release --no-restore

    outputs:
      build_success: ${{ steps.build.outcome == 'success' }}

  test:
    name: Run Tests
    runs-on: windows-latest
    needs: build  # Зависит от успешного выполнения job 'build'

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies (for tests)
      run: dotnet restore ./Server/BooksLab.sln

    - name: Run Tests
      run: dotnet test ./Server/BooksLab.sln --configuration Release --no-build --verbosity normal

  save-in-cloud:
    needs: test  # Ждём успешного завершения тестов
    name: Push_to_Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Авторизация в Yandex Container Registry
      - name: Login to YCR
        run: |
          echo "${{ secrets.YC_DOCKER_PASSWORD }}" | docker login \
            --username iam \
            --password-stdin \
            cr.yandex

      # Сборка Docker-образа
      - name: Build Docker image
        run: |
          docker build -t cr.yandex/crp10cd1h16114aqlaaj/dino-server:latest .
          
      # Пуш образа в YCR
      - name: Push to YCR
        run: |
          docker push cr.yandex/crp10cd1h16114aqlaaj/dino-server:latest
