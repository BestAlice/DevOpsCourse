name: .NET CI

on:
  push:
    branches: [ "main", "lab2" ]
  pull_request:
    branches: [ "main", "lab2" ]

jobs:
  save-in-cloud:
    name: Push_to_Docker
    runs-on: ubuntu-latest
    env:
          IMAGE_NAME: dino-server
          YC_TOKEN: ${{ secrets.YC_DOCKER_PASSWORD }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0'  # Укажите вашу версию .NET
      - name: Install YC CLI (direct method)
        run: |
          # Скачиваем бинарник напрямую
          mkdir -p $HOME/yandex-cloud/bin
          curl -L https://storage.yandexcloud.net/yandexcloud-yc/release/stable/linux/amd64/yc -o $HOME/yandex-cloud/bin/yc
          chmod +x $HOME/yandex-cloud/bin/yc
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH
          echo "::add-path::$HOME/yandex-cloud/bin"

      - name: Configure YC CLI
        run: |
          # Проверяем что yc доступен
          which yc
          yc --version
          
          # Настраиваем аутентификацию
          mkdir -p $HOME/.config/yandex-cloud
          echo "${{ secrets.YC_SERVICE_ACCOUNT_KEY }}" > $HOME/.config/yandex-cloud/key.json
          ./$HOME/yandex-cloud/bin/yc config set service-account-key $HOME/.config/yandex-cloud/key.json
          ./$HOME/yandex-cloud/bin/yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          ./$HOME/yandex-cloud/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Docker Login
        run: |
          # Используем полный путь к yc
          $HOME/yandex-cloud/bin/yc container registry configure-docker
          echo "${{ secrets.YC_DOCKER_PASSWORD }}" | docker login \
            --username iam \
            --password-stdin \
            cr.yandex.ru

      - name: Build Docker image
        run: |
          docker build -t cr.yandex/crp10cd1h16114aqlaaj/dino-server:latest ./Server
      - name: Push to YCR
        run: |
          docker push cr.yandex/crp10cd1h16114aqlaaj/dino-server:latest
  build:
    name: Build Solution
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore dependencies
        run: dotnet restore ./Server/BooksLab.sln
      - name: Build Solution
        run: dotnet build ./Server/BooksLab.sln --configuration Release --no-restore
        id: build
    outputs:
      build_success: ${{ steps.build.outcome == 'success' }}

  test:
    name: Run Tests
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore dependencies (for tests)
        run: dotnet restore ./Server/BooksLab.sln
      - name: Run Tests
        run: dotnet test ./Server/DinoTest/DinoTest.csproj
